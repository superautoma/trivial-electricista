name: Apply editor fix
on:
  push:
    paths:
      - 'tools/fix_editor_layout.py'
      - 'tools/fix_editor_duplicate_list.py'
      - 'tools/install_review_flags.py'
      - 'tools/install_answer_fix.py'
      - 'tools/remove_correction_menu.py'
      - 'tools/fix_explanation_visibility.py'
      - 'review-flags.js'
      - 'answer-fix.js'
      - '.github/workflows/apply-editor-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply layout patch
        run: python3 tools/fix_editor_layout.py
      - name: Remove duplicate legacy editor list
        run: python3 tools/fix_editor_duplicate_list.py
      - name: Install question review feature
        run: python3 tools/install_review_flags.py
      - name: Install reliable answer explanation fallback
        run: python3 tools/install_answer_fix.py
      - name: Remove duplicate correction option from menu
        run: python3 tools/remove_correction_menu.py
      - name: Fix explanation visibility timing
        run: python3 tools/fix_explanation_visibility.py
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix explanation visibility timing'
          git push
