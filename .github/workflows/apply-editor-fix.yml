name: Apply editor fix
on:
  push:
    paths:
      - 'tools/fix_editor_layout.py'
      - 'tools/fix_editor_duplicate_list.py'
      - '.github/workflows/apply-editor-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply layout patch
        run: python3 tools/fix_editor_layout.py
      - name: Remove duplicate legacy editor list
        run: python3 tools/fix_editor_duplicate_list.py
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix duplicate question editor list'
          git push
