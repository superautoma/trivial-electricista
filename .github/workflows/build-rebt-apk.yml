name: Build REBT APK

on:
  push:
    branches:
      - rebt-apk-build
    paths:
      - "rebt_apk/**"
      - ".github/workflows/build-rebt-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             git zip unzip autoconf automake libtool pkg-config             zlib1g-dev libncurses5-dev libncursesw5-dev             cmake libffi-dev libssl-dev libltdl-dev

      - name: Install current Buildozer toolchain
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.34" legacy-cgi
          python -m pip install "git+https://github.com/kivy/buildozer.git"

      - name: Build debug APK
        working-directory: rebt_apk
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          rm -rf .buildozer
          yes | buildozer -v android debug

      - name: Show APK
        if: always()
        run: |
          find rebt_apk -maxdepth 3 -type f -name "*.apk" -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REBT-Cuestionados-APK
          path: rebt_apk/bin/*.apk
          if-no-files-found: error
